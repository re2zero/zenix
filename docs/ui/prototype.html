<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zenix — UI 交互原型</title>
<style>
/* ── tokens ────────────────────────────────────────────────────────────────
   Names mirror gpui-component's Theme tokens one-for-one, so a region drawn
   here has a single Rust field to move to. Values are the prototype's own. */
:root {
  --background: #0b0d11;
  --card: #14171d;
  --foreground: #d5dae2;
  --muted: #12161c;
  --muted-foreground: #7b8492;
  --border: #242a33;
  --accent: #5cc8d7;
  --accent-foreground: #071519;
  --primary: #58a6ff;
  --primary-foreground: #04101f;
  --sidebar: #0e1116;
  --sidebar-border: #1e232b;
  --sidebar-foreground: #b7bec9;
  --sidebar-accent: #1a1f27;
  --sidebar-accent-foreground: #eef3f9;
  --title-bar: #0f1217;
  --title-bar-border: #1f242c;
  --status-bar: #0f1217;
  --status-bar-border: #1f242c;
  --tab-bar: #0f1217;
  --tab: #161a21;
  --tab-active: #0e1014;
  --tab-active-foreground: #eef3f9;
  --tab-foreground: #8892a0;
  --list-hover: #191e26;
  --list-active: #1b2430;
  --selection: #173039;
  --scrollbar-thumb: #2b3340;
  --success: #7fd88f;
  --warning: #e0b341;
  --danger: #e06c75;
  --info: #61afef;
  --violet: #b48ef0;
  --ui: system-ui, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
  --mono: "Lilex", "JetBrains Mono", "SFMono-Regular", ui-monospace, monospace;
  --rail-w: 46px;
  --sidebar-w: 276px;
  --aside-w: 372px;
  --titlebar-h: 38px;
  --statusbar-h: 26px;
  --tab-h: 36px;
  --r: 5px;
}

html[data-theme="light"] {
  color-scheme: light;
  --background: #f7f7f5;
  --card: #ffffff;
  --foreground: #23272e;
  --muted: #f0f0ee;
  --muted-foreground: #6b7280;
  --border: #e2e2df;
  --accent: #0e8f9e;
  --accent-foreground: #ffffff;
  --primary: #1a6fd4;
  --primary-foreground: #ffffff;
  --sidebar: #f2f2f0;
  --sidebar-border: #e2e2df;
  --sidebar-foreground: #3d434c;
  --sidebar-accent: #e9e9e5;
  --sidebar-accent-foreground: #14171c;
  --title-bar: #f4f4f2;
  --title-bar-border: #e2e2df;
  --status-bar: #f4f4f2;
  --status-bar-border: #e2e2df;
  --tab-bar: #f0f0ee;
  --tab: #e9e9e6;
  --tab-active: #fbfbfa;
  --tab-active-foreground: #14171c;
  --tab-foreground: #666c76;
  --list-hover: #ebebe8;
  --list-active: #e3e8ec;
  --selection: #d8ecf0;
  --scrollbar-thumb: #cdcdc8;
  --success: #2f8f4e;
  --warning: #9a6b00;
  --danger: #c0392b;
  --info: #1a6fd4;
  --violet: #6d3fb5;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--background);
  color: var(--foreground);
  font: 13px/1.45 var(--ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
::selection { background: var(--selection); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }
.kbd {
  font: 10px/1 var(--mono);
  color: var(--muted-foreground);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 2px 4px;
  white-space: nowrap;
}
.mono { font-family: var(--mono); }
.dim { color: var(--muted-foreground); }
.svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ── shell frame ─────────────────────────────────────────────────────────── */
.app {
  height: 100vh;
  display: grid;
  grid-template-rows: var(--titlebar-h) 1fr var(--statusbar-h);
  background: var(--background);
}

.titlebar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px 0 10px;
  background: var(--title-bar);
  border-bottom: 1px solid var(--title-bar-border);
  user-select: none;
}
.brand { display: flex; align-items: center; gap: 7px; padding-right: 4px; }
.brand-mark {
  width: 18px; height: 18px; border-radius: 4px;
  background: linear-gradient(140deg, var(--accent), var(--primary));
  display: grid; place-items: center;
  color: #06151a; font: 700 11px/1 var(--mono);
}
.brand-name { font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.titlebar .divider { width: 1px; height: 16px; background: var(--border); }
.ws-pill { display: flex; align-items: center; gap: 7px; padding: 3px 7px; border-radius: var(--r); }
.ws-pill:hover { background: var(--list-hover); }
.ws-pill .name { font-size: 12.5px; font-weight: 550; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  height: 18px; padding: 0 6px; border-radius: 9px;
  font: 10.5px/1 var(--mono);
  background: var(--muted); color: var(--muted-foreground);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.chip.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.chip.plugin { color: var(--violet); border-color: color-mix(in srgb, var(--violet) 38%, transparent); background: color-mix(in srgb, var(--violet) 10%, transparent); }
.conn { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted-foreground); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); flex: none; }
.dot.busy { background: var(--info); animation: pulse 1.6s ease-in-out infinite; }
.dot.warn { background: var(--warning); }
.dot.err { background: var(--danger); }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

.titlebar .grow { flex: 1; }
.cmd-trigger {
  display: flex; align-items: center; gap: 8px;
  width: min(420px, 32vw);
  height: 24px; padding: 0 8px;
  border: 1px solid var(--border); border-radius: var(--r);
  background: var(--background); color: var(--muted-foreground);
  font-size: 11.5px;
}
.cmd-trigger:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); color: var(--foreground); }
.cmd-trigger .grow { flex: 1; text-align: left; }
.tb-btn {
  display: grid; place-items: center;
  width: 26px; height: 24px; border-radius: 4px; color: var(--muted-foreground);
}
.tb-btn:hover { background: var(--list-hover); color: var(--foreground); }
.tb-btn.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.wc { display: flex; gap: 2px; margin-left: 4px; }
.wc button { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 4px; color: var(--muted-foreground); }
.wc button:hover { background: var(--list-hover); }
.wc button.close:hover { background: var(--danger); color: #fff; }

/* ── body: rail | sidebar | main | aside ─────────────────────────────────── */
.body { display: flex; min-height: 0; }
.rail {
  width: var(--rail-w); flex: none;
  display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 6px 0;
  background: var(--sidebar);
  border-right: 1px solid var(--sidebar-border);
}
.rail-btn {
  position: relative;
  width: 34px; height: 34px; border-radius: 6px;
  display: grid; place-items: center;
  color: var(--sidebar-foreground);
}
.rail-btn:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.rail-btn.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.rail-btn.on::before {
  content: ""; position: absolute; left: -6px; top: 8px; bottom: 8px;
  width: 2px; border-radius: 2px; background: var(--accent);
}
.rail-btn .badge-count {
  position: absolute; right: 1px; top: 1px;
  min-width: 13px; height: 13px; padding: 0 3px;
  border-radius: 7px; background: var(--info); color: #04101f;
  font: 600 9px/13px var(--ui); text-align: center;
}
.rail .grow { flex: 1; }

.sidebar {
  position: relative; flex: none;
  width: var(--sidebar-w);
  display: flex; flex-direction: column;
  background: var(--sidebar);
  border-right: 1px solid var(--sidebar-border);
  min-width: 200px;
}
.pane-head {
  display: flex; align-items: center; gap: 8px;
  height: 34px; padding: 0 8px 0 11px;
  flex: none;
  border-bottom: 1px solid var(--sidebar-border);
}
.pane-head h2 { margin: 0; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); }
.pane-head .count { font: 10px/1 var(--mono); color: var(--muted-foreground); }
.pane-head .grow { flex: 1; }
.icon-btn { width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; color: var(--muted-foreground); }
.icon-btn:hover { background: var(--list-hover); color: var(--foreground); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.sidebar .scroll { padding: 6px 6px 12px; }
.sidebar-foot { flex: none; padding: 5px 10px; border-top: 1px solid var(--sidebar-border); font-size: 10.5px; color: var(--muted-foreground); }

.grip { position: absolute; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 5; }
.grip::after { content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: transparent; transition: background .12s; }
.grip:hover::after, .grip.drag::after { background: var(--accent); }
.grip-right { right: -3px; }
.grip-left { left: -3px; }
.grip-right::after { right: 3px; }
.grip-left::after { left: 3px; }

/* sidebar rows */
.sec { margin-bottom: 10px; }
.sec-title {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 6px; font-size: 10.5px; font-weight: 650;
  letter-spacing: .07em; text-transform: uppercase; color: var(--muted-foreground);
}
.sec-title .grow { flex: 1; }
.row {
  position: relative;
  display: flex; align-items: center; gap: 7px;
  min-height: 28px; padding: 4px 7px; border-radius: 6px;
  color: var(--sidebar-foreground); cursor: default;
}
.row:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.row.on { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.row.on::before { content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 2px; border-radius: 2px; background: var(--accent); }
.row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.row .sub { font: 10.5px/1.4 var(--mono); color: var(--muted-foreground); }
.row .trail { display: flex; align-items: center; gap: 5px; flex: none; }
.row.nested { padding-left: 22px; }
.row .twisty { width: 12px; color: var(--muted-foreground); font-size: 9px; }
.pgroup { border-left: 1px solid var(--sidebar-border); margin-left: 12px; padding-left: 2px; }

/* status dots */
.st { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--muted-foreground); }
.st .d { width: 6px; height: 6px; border-radius: 50%; }
.st.running .d { background: var(--info); animation: pulse 1.6s ease-in-out infinite; }
.st.blocked .d { background: var(--warning); }
.st.done .d { background: var(--success); }
.st.failed .d { background: var(--danger); }
.st.idle .d { background: #4a525e; }
.st.running { color: var(--info); }
.st.blocked { color: var(--warning); }
.st.done { color: var(--success); }
.st.failed { color: var(--danger); }

/* ── main area ───────────────────────────────────────────────────────────── */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--background); }
.tabstrip {
  height: calc(var(--tab-h) + 4px); flex: none;
  display: flex; align-items: center; gap: 4px;
  background: var(--background);
  border-bottom: 1px solid var(--border);
  padding: 0 8px;
  overflow-x: auto; overflow-y: hidden;
}
.tabstrip::-webkit-scrollbar { height: 0; }
.tab {
  display: flex; align-items: center; gap: 7px;
  height: 26px; padding: 0 7px 0 9px;
  max-width: 240px; min-width: 88px;
  border: 1px solid transparent;
  border-radius: 6px;
  color: var(--tab-foreground); font-size: 12px;
  background: transparent;
}
.tab:hover { color: var(--tab-active-foreground); background: var(--muted); }
.tab.on { background: var(--card); color: var(--tab-active-foreground); border-color: var(--border); }
.tab .t-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .t-panes { font: 9.5px/1 var(--mono); color: var(--muted-foreground); border: 1px solid var(--border); border-radius: 3px; padding: 1px 3px; }
.tab .t-close { width: 15px; height: 15px; display: grid; place-items: center; border-radius: 3px; color: var(--muted-foreground); opacity: 0; }
.tab:hover .t-close, .tab.on .t-close { opacity: 1; }
.tab .t-close:hover { background: var(--muted); color: var(--danger); }
.tabstrip .grow { flex: 1; }
.tabstrip-actions { display: flex; align-items: center; gap: 2px; padding: 0 2px; }

.panes {
  flex: 1; min-height: 0;
  display: grid; gap: 8px;
  background: var(--background);
  padding: 8px;
}
.panes[data-panes="1"] { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.panes[data-panes="3"] { grid-template-columns: 1.55fr 1fr; grid-template-rows: 1fr 1fr; }
.panes[data-panes="3"] > .pane:first-child { grid-row: 1 / 3; }
.pane {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.pane:hover { border-color: color-mix(in srgb, var(--muted-foreground) 45%, var(--border)); }
.pane.focused { border-color: color-mix(in srgb, var(--accent) 70%, var(--border)); }
.pane.focused .pane-title { color: var(--foreground); }
.pane-bar {
  height: 30px; flex: none;
  display: flex; align-items: center; gap: 7px;
  padding: 0 6px 0 11px;
  background: transparent;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 65%, transparent);
  font-size: 11px;
}
.pane.focused .pane-bar { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.pane-title { color: var(--muted-foreground); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pane-bar .grow { flex: 1; }
.pane-bar .p-actions { display: flex; gap: 1px; opacity: .55; }
.pane:hover .pane-bar .p-actions { opacity: 1; }
.pane-body {
  flex: 1; min-height: 0; overflow: auto;
  padding: 8px 10px 12px;
  font: 11.5px/1.62 var(--mono);
  white-space: pre-wrap; word-break: break-word;
}
.pane-body.tight { padding: 6px 8px; font-size: 11px; }

/* empty state: what a tab shows before it has a pane */
.empty {
  flex: 1; min-height: 0; display: grid; place-items: center;
  padding: 32px 24px; overflow-y: auto;
}
.empty-inner { width: min(560px, 100%); }
.empty-mark {
  width: 40px; height: 40px; border-radius: 11px; margin-bottom: 14px;
  background: linear-gradient(140deg, var(--accent), var(--primary));
  display: grid; place-items: center; color: #06151a;
}
.empty h3 { margin: 0 0 4px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.empty p { margin: 0 0 16px; font-size: 12.5px; color: var(--muted-foreground); }
.empty-input {
  display: flex; align-items: center; gap: 9px;
  height: 44px; padding: 0 12px; margin-bottom: 14px;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--card); color: var(--muted-foreground);
  font-size: 13px;
}
.empty-input:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); color: var(--foreground); }
.empty-input .grow { flex: 1; text-align: left; }
.empty-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.empty-card {
  display: block; text-align: left;
  padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px;
  background: var(--card); color: var(--foreground);
}
.empty-card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background: color-mix(in srgb, var(--accent) 5%, var(--card)); }
.empty-card .t { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 550; }
.empty-card .d { margin-top: 2px; font-size: 11px; color: var(--muted-foreground); }
.empty-hint { margin-top: 16px; font-size: 11px; color: var(--muted-foreground); }

.term-line { display: block; min-height: 1.62em; }
.t-dim { color: var(--muted-foreground); }
.t-ok { color: var(--success); }
.t-warn { color: var(--warning); }
.t-err { color: var(--danger); }
.t-info { color: var(--info); }
.t-accent { color: var(--accent); }
.t-violet { color: var(--violet); }
.t-b { font-weight: 600; }
.prompt-user { color: var(--success); }
.prompt-path { color: var(--info); }
.prompt-sign { color: var(--muted-foreground); }
.cursor { display: inline-block; width: 6px; height: 12px; background: var(--accent); vertical-align: -2px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }

/* agent stream in a pane */
.msg-role { color: var(--violet); font-weight: 600; }
.tool-card {
  margin: 5px 0 7px; border: 1px solid var(--border); border-radius: 4px;
  background: var(--muted);
  font: 11px/1.5 var(--mono); overflow: hidden;
}
.tool-card .tc-head {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 7px; border-bottom: 1px solid var(--border);
  color: var(--muted-foreground); font-size: 10.5px;
}
.tool-card .tc-body { padding: 4px 7px; color: var(--muted-foreground); }
.tool-card.running { border-color: color-mix(in srgb, var(--info) 40%, var(--border)); }
.tool-card.running .tc-head { color: var(--info); }

/* ── aside ──────────────────────────────────────────────────────────────── */
.aside {
  position: relative; flex: none;
  width: var(--aside-w); min-width: 260px; max-width: 560px;
  display: flex; flex-direction: column;
  background: var(--sidebar);
  border-left: 1px solid var(--sidebar-border);
}
.aside.hidden { display: none; }
.aside-head {
  height: 34px; flex: none;
  display: flex; align-items: center; gap: 2px;
  padding: 0 6px 0 6px;
  border-bottom: 1px solid var(--sidebar-border);
}
.a-tab {
  display: flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 8px; border-radius: 4px;
  font-size: 11.5px; color: var(--muted-foreground);
}
.a-tab:hover { background: var(--list-hover); color: var(--foreground); }
.a-tab.on { background: var(--list-active); color: var(--foreground); }
.a-tab .n { font: 9.5px/1 var(--mono); color: var(--muted-foreground); }
.aside-head .grow { flex: 1; }
.aside-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; }
.aside-body.chat { display: flex; flex-direction: column; overflow: hidden; }
.chat-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-right: 2px; }
.chat-compose { flex: none; padding-top: 6px; margin-top: 6px; }

/* chat */
.msg { margin-bottom: 14px; }
.msg .who { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 10.5px; color: var(--muted-foreground); }
.msg .who .av { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font: 600 9px/1 var(--mono); }
.msg.user .av { background: var(--list-active); color: var(--foreground); }
.msg.agent .av { background: color-mix(in srgb, var(--violet) 22%, transparent); color: var(--violet); }
.msg .text { font-size: 12.5px; line-height: 1.55; }
.msg .text code { font: 11px/1 var(--mono); background: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 1px 4px; }
.msg .tools { margin-top: 6px; }
.composer { margin-top: 4px; border: 1px solid var(--border); border-radius: 16px; background: var(--card); padding: 9px 9px 8px; }
.composer:focus-within { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.composer textarea {
  display: block; width: 100%; height: 56px; resize: none;
  background: none; border: 0; outline: 0; padding: 0 2px;
  font: 13px/1.5 var(--ui); color: inherit;
}
.composer .c-bar { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
.composer .c-bar .grow { flex: 1; }
.composer-ctx {
  display: flex; align-items: center; gap: 5px;
  padding: 0 2px 6px; font: 10px/1.4 var(--mono); color: var(--muted-foreground);
}
.composer-ctx .grow { flex: 1; }
.icon-round {
  width: 26px; height: 26px; border-radius: 50%; flex: none;
  border: 1px solid var(--border);
  display: grid; place-items: center; color: var(--muted-foreground);
}
.icon-round:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); color: var(--foreground); }
.picker { position: relative; display: flex; }
.pill-btn {
  display: flex; align-items: center; gap: 4px;
  height: 26px; padding: 0 8px; border-radius: 13px;
  color: var(--muted-foreground); font-size: 11.5px;
}
.pill-btn:hover, .pill-btn.open { background: var(--list-hover); color: var(--foreground); }
.pop {
  position: absolute; bottom: 32px; left: 0; z-index: 12;
  min-width: 186px; padding: 4px;
  background: var(--background); border: 1px solid var(--border); border-radius: 7px;
  box-shadow: 0 10px 28px rgba(0,0,0,.4);
}
.pop .item {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 7px; border-radius: 4px; font-size: 12px; color: var(--foreground);
}
.pop .item:hover { background: var(--list-hover); }
.pop .item .sub { margin-left: auto; font: 10px/1 var(--mono); color: var(--muted-foreground); }
.pop .item.on { color: var(--accent); }
.pop .sep { height: 1px; margin: 3px 4px; background: var(--border); }
.pop .cap { padding: 5px 7px 3px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
.send-round {
  width: 28px; height: 28px; flex: none; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--muted); color: var(--muted-foreground);
  margin-left: 2px;
}
.send-round.ready { background: var(--accent); color: var(--accent-foreground); }
.send-round:not(.ready) { cursor: default; }

/* fleet */
.fleet-card { border: 1px solid var(--border); border-radius: 5px; background: var(--background); padding: 8px; margin-bottom: 7px; }
.fleet-card.lead { border-color: color-mix(in srgb, var(--info) 45%, var(--border)); }
.fc-head { display: flex; align-items: center; gap: 7px; }
.fc-head .nm { font-size: 12px; font-weight: 600; }
.fc-head .grow { flex: 1; }
.fc-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; font: 10.5px/1.4 var(--mono); color: var(--muted-foreground); }
.timeline { display: flex; align-items: center; gap: 2px; margin-top: 6px; }
.timeline .seg { height: 4px; border-radius: 2px; flex: 1; background: var(--muted); }
.timeline .seg.running { background: var(--info); }
.timeline .seg.blocked { background: var(--warning); }
.timeline .seg.done { background: var(--success); }
.timeline .seg.failed { background: var(--danger); }
.fc-actions { display: flex; gap: 5px; margin-top: 7px; }
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 8px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--muted);
  font-size: 11.5px; color: var(--foreground);
}
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-foreground); font-weight: 600; }
.btn.ghost { background: none; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); background: none; }
.btn.warn { background: var(--warning); border-color: var(--warning); color: #1a1300; font-weight: 600; }
.btn.sm { height: 20px; font-size: 11px; padding: 0 6px; }
.split-head { display: flex; align-items: center; gap: 6px; margin: 12px 0 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted-foreground); }
.split-head .grow { flex: 1; }
.tail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tail { border: 1px solid var(--border); border-radius: 4px; background: var(--background); overflow: hidden; }
.tail .h { padding: 3px 6px; font: 10px/1.4 var(--mono); color: var(--muted-foreground); border-bottom: 1px solid var(--border); display: flex; gap: 5px; align-items: center; }
.tail pre { margin: 0; padding: 5px 6px; font: 10.5px/1.5 var(--mono); color: var(--muted-foreground); max-height: 120px; overflow: auto; white-space: pre-wrap; }

/* plugin panel card */
.plugin-panel { border: 1px solid var(--border); border-radius: 5px; background: var(--background); margin-bottom: 8px; overflow: hidden; }
.pp-head { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-bottom: 1px solid var(--border); background: var(--muted); }
.pp-head .nm { font-size: 11.5px; font-weight: 600; }
.pp-head .grow { flex: 1; }
.pp-body { padding: 8px; font-size: 12px; color: var(--sidebar-foreground); }
.plugin-badge {
  display: inline-flex; align-items: center; gap: 3px;
  height: 15px; padding: 0 4px; border-radius: 3px;
  font: 9px/1 var(--mono); letter-spacing: .04em;
  color: var(--violet); background: color-mix(in srgb, var(--violet) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--violet) 30%, transparent);
}

/* ── status bar ─────────────────────────────────────────────────────────── */
.statusbar {
  display: flex; align-items: stretch; gap: 0;
  background: var(--status-bar);
  border-top: 1px solid var(--status-bar-border);
  font-size: 11px; color: var(--muted-foreground);
  padding-right: 6px;
  overflow: hidden;
}
.seg { display: flex; align-items: center; gap: 6px; padding: 0 9px; white-space: nowrap; }
.seg + .seg { border-left: 1px solid var(--status-bar-border); }
.seg.click:hover { background: var(--list-hover); color: var(--foreground); }
.seg .grow { flex: 1; }
.seg.plugin-seg { color: var(--violet); background: color-mix(in srgb, var(--violet) 7%, transparent); }
.seg.warn-seg { color: var(--warning); }
.statusbar .grow { flex: 1; }

/* ── overlays ───────────────────────────────────────────────────────────── */
.overlay-host { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
.backdrop {
  position: absolute; inset: 0; pointer-events: auto;
  background: color-mix(in srgb, #000 45%, transparent);
  backdrop-filter: blur(2px);
}
html[data-theme="light"] .backdrop { background: color-mix(in srgb, #000 22%, transparent); }
.dialog {
  position: absolute; pointer-events: auto;
  background: var(--background);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 18px 48px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
  display: flex; flex-direction: column; overflow: hidden;
}
.dialog.palette { left: 50%; top: 11vh; transform: translateX(-50%); width: min(680px, 92vw); max-height: 68vh; }
.dialog.settings { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(1000px, 94vw); height: min(660px, 88vh); }
.dialog.plugins { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(1060px, 95vw); height: min(680px, 90vh); }
.dialog.trust { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, 92vw); max-height: 80vh; }
.drawer {
  position: absolute; pointer-events: auto; top: 0; bottom: 0; right: 0;
  width: min(460px, 94vw);
  background: var(--background); border-left: 1px solid var(--border);
  box-shadow: -18px 0 48px rgba(0,0,0,.35);
  display: flex; flex-direction: column;
}
.dlg-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); flex: none; }
.dlg-head h3 { margin: 0; font-size: 13px; font-weight: 600; }
.dlg-head .grow { flex: 1; }
.dlg-body { flex: 1; min-height: 0; overflow: auto; }
.dlg-foot { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); }

.pal-input { display: flex; align-items: center; gap: 8px; padding: 11px 12px; border-bottom: 1px solid var(--border); }
.pal-input input { flex: 1; background: none; border: 0; outline: 0; font-size: 14px; }
.pal-list { overflow-y: auto; padding: 6px; }
.pal-group { padding: 6px 8px 3px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); }
.pal-item { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 5px; cursor: default; }
.pal-item.sel { background: var(--list-active); }
.pal-item .nm { flex: 1; font-size: 12.5px; }
.pal-item .hint { font: 10.5px/1 var(--mono); color: var(--muted-foreground); }
.pal-item .src { font: 9px/1 var(--mono); color: var(--violet); }
.pal-empty { padding: 22px 12px; text-align: center; color: var(--muted-foreground); font-size: 12px; }

.tabs-left { display: flex; flex-direction: column; width: 190px; flex: none; border-right: 1px solid var(--border); padding: 8px 6px; gap: 1px; background: var(--sidebar); }
.snav { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 4px; color: var(--sidebar-foreground); font-size: 12px; text-align: left; }
.snav:hover { background: var(--sidebar-accent); }
.snav.on { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
.snav .grow { flex: 1; }
.snav .warn { color: var(--warning); font: 10px/1 var(--mono); }
.sform { flex: 1; overflow-y: auto; padding: 14px 18px 24px; }
.sform h4 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.sform .desc { margin: 0 0 14px; font-size: 12px; color: var(--muted-foreground); }
.field { display: flex; align-items: flex-start; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.field:last-child { border-bottom: 0; }
.field .fl { width: 190px; flex: none; }
.field .fl .t { font-size: 12.5px; }
.field .fl .d { font-size: 11px; color: var(--muted-foreground); margin-top: 2px; }
.field .fc { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
.segmented button { padding: 4px 10px; font-size: 11.5px; color: var(--muted-foreground); }
.segmented button + button { border-left: 1px solid var(--border); }
.segmented button.on { background: var(--list-active); color: var(--foreground); }
select.input, input.input {
  height: 26px; padding: 0 7px; border-radius: 4px;
  border: 1px solid var(--border); background: var(--background); color: inherit;
  font-size: 12px; min-width: 150px; outline: 0;
}
input.input:focus, select.input:focus { border-color: var(--accent); }
.slider { display: flex; align-items: center; gap: 8px; }
.slider input[type=range] { width: 150px; accent-color: var(--accent); }
.slider .v { font: 11px/1 var(--mono); color: var(--muted-foreground); min-width: 42px; }
.note { display: flex; gap: 7px; padding: 8px 10px; border-radius: 5px; font-size: 11.5px; line-height: 1.5; }
.note.warn { background: color-mix(in srgb, var(--warning) 10%, transparent); border: 1px solid color-mix(in srgb, var(--warning) 32%, transparent); color: var(--warning); }
.note.info { background: color-mix(in srgb, var(--info) 9%, transparent); border: 1px solid color-mix(in srgb, var(--info) 28%, transparent); color: var(--info); }
.code {
  margin: 0; padding: 9px 11px; border-radius: 5px;
  background: var(--muted); border: 1px solid var(--border);
  font: 11px/1.62 var(--mono); color: var(--sidebar-foreground);
  overflow: auto; max-height: 300px; white-space: pre;
}
.code .k { color: var(--info); }
.code .s { color: var(--success); }
.code .c { color: var(--muted-foreground); }
.code .n { color: var(--warning); }

/* plugins manager */
.plug-layout { display: flex; height: 100%; min-height: 0; }
.plug-list { width: 290px; flex: none; border-right: 1px solid var(--border); overflow-y: auto; padding: 6px; }
.plug-item { padding: 8px; border-radius: 5px; border: 1px solid transparent; margin-bottom: 3px; }
.plug-item:hover { background: var(--list-hover); }
.plug-item.on { background: var(--list-active); border-color: var(--border); }
.pi-top { display: flex; align-items: center; gap: 7px; }
.pi-top .nm { font-size: 12.5px; font-weight: 600; }
.pi-top .grow { flex: 1; }
.pi-meta { margin-top: 2px; font: 10.5px/1.5 var(--mono); color: var(--muted-foreground); display: flex; gap: 8px; flex-wrap: wrap; }
.plug-detail { flex: 1; min-width: 0; overflow-y: auto; padding: 14px 16px 24px; }
.pd-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
.pd-head h4 { margin: 0; font-size: 15px; }
.pd-head .grow { flex: 1; }
.pd-path { font: 10.5px/1.5 var(--mono); color: var(--muted-foreground); }
.kv { display: grid; grid-template-columns: 132px 1fr; gap: 4px 12px; font-size: 11.5px; margin: 10px 0 14px; }
.kv dt { color: var(--muted-foreground); }
.kv dd { margin: 0; }
table.slots { width: 100%; border-collapse: collapse; font-size: 11.5px; }
table.slots th { text-align: left; font-weight: 600; color: var(--muted-foreground); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 5px 6px; border-bottom: 1px solid var(--border); }
table.slots td { padding: 5px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.slots tr:last-child td { border-bottom: 0; }
table.slots td.k { font: 10.5px/1.5 var(--mono); color: var(--accent); white-space: nowrap; }
.hint-txt { font-size: 11px; color: var(--muted-foreground); line-height: 1.6; }
.section-label { margin: 16px 0 6px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); }

/* trust review */
.hazard { display: inline-flex; align-items: center; gap: 4px; font: 9.5px/1 var(--mono); padding: 2px 5px; border-radius: 3px; border: 1px solid; }
.hazard.hi { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); background: color-mix(in srgb, var(--danger) 10%, transparent); }
.hazard.mid { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 45%, transparent); background: color-mix(in srgb, var(--warning) 10%, transparent); }
.hazard.lo { color: var(--muted-foreground); border-color: var(--border); }
.argv { font: 11px/1.7 var(--mono); }
.argv .ln { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--border); }
.argv .ln:last-child { border-bottom: 0; }
.argv .ln .idx { color: var(--muted-foreground); width: 14px; flex: none; }
.argv .ln .cmd { flex: 1; }

.spec-sec { margin-bottom: 16px; }
.spec-sec h5 { margin: 0 0 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
.spec-sec p { margin: 0 0 6px; font-size: 12px; line-height: 1.6; color: var(--sidebar-foreground); }
.spec-sec ul { margin: 0; padding-left: 16px; font-size: 12px; line-height: 1.7; color: var(--sidebar-foreground); }
.spec-sec code { font: 11px/1 var(--mono); background: var(--muted); padding: 1px 4px; border-radius: 3px; border: 1px solid var(--border); }

@media (max-width: 1180px) { .aside { display: none; } }
@media (max-width: 900px) { .sidebar { display: none; } }
</style>

<script>
"use strict";

/* ── icons ──────────────────────────────────────────────────────────────── */
const ICONS = {
  workspaces: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/>',

  plugins: '<path d="M9 4h3a2 2 0 0 1 2 2v1.5a1.5 1.5 0 1 0 3 0V6h1a2 2 0 0 1 2 2v3h-1.5a1.5 1.5 0 1 0 0 3H20v3a2 2 0 0 1-2 2h-3v-1.5a1.5 1.5 0 1 0-3 0V19H9a2 2 0 0 1-2-2v-3H5.5a1.5 1.5 0 1 1 0-3H7V6a2 2 0 0 1 2-2Z"/>',

  folder: '<path d="M4 7a2 2 0 0 1 2-2h3l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>',
  branch: '<circle cx="7" cy="6" r="2"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="9" r="2"/><path d="M7 8v8M17 11c0 3-4 3.5-8 4"/>',
  terminal: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/>',

  shield: '<path d="M12 3 5 6v7c0 4 3 6.5 7 8 4-1.5 7-4 7-8V6Z"/>',
  chat: '<path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-5 4Z"/>',
  more: '<circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/>',
  gearSmall: '<circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M6 6l1.5 1.5M16.5 16.5 18 18M4 12h2M18 12h2M6 18l1.5-1.5M16.5 7.5 18 6"/>'

  return '<svg class="svg" viewBox="0 0 24 24" style="width:' + s + 'px;height:' + s + 'px">' + ICONS[name] + '</svg>';

/* ── mock model ─────────────────────────────────────────────────────────── */
const model = {
  workspaces: [

/* ── render ─────────────────────────────────────────────────────────────── */
function render() {
  document.documentElement.dataset.theme = state.theme;
  $("sidebar").style.display = state.sidebarVisible ? "" : "none";
  $("aside").style.width = state.asideVisible ? "var(--aside-w)" : "";
  renderTitle();
  renderRail();
  renderSidebar();
  renderTabs();
  renderPanes();
  renderAside();
  renderStatus();
  renderOverlay();
}

/* ── interactions ───────────────────────────────────────────────────────── */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case "rail":
      state.rail = el.dataset.rail;
      render();
      break;
    case "aside":
      state.aside = el.dataset.aside;
      state.asideVisible = true;
      render();
      break;
    case "tab":
      e.stopPropagation();
      state.tab = el.dataset.tab;
      render();
      break;
    case "close-tab":
      e.stopPropagation();
      break;
    case "focus-pane":
      document.querySelectorAll(".pane").forEach((p) => p.classList.remove("focused"));
      el.closest(".pane").classList.add("focused");
      break;
    case "workspace":
      model.workspaces.forEach((w) => (w.on = w.id === el.dataset.ws));
      render();
      break;
    case "palette":
      state.overlay = "palette";
      state.paletteQuery = "";
      render();
      setTimeout(() => { const i = $("palInput"); if (i) i.focus(); }, 0);
      break;
    case "palette-pick":
      state.overlay = null;
      render();
      break;
    case "close-overlay":
      state.overlay = null;
      render();
      break;
    case "settings":
      state.overlay = "settings";
      if (el.dataset.page) state.settingsPage = el.dataset.page;
      render();
      break;
    case "settings-page":
      state.settingsPage = el.dataset.page;
      render();
      break;
    case "plugins-manager":
      state.overlay = "plugins";
      render();
      break;
    case "plugin":
      state.plugin = el.dataset.plugin;
      state.overlay = "plugins";
      render();
      break;
    case "trust":
      state.overlay = "trust";
      render();
      break;
    case "spec":
      state.overlay = "spec";
      render();
      break;
    case "event-filter":
      state.eventFilter = el.dataset.filter;
      render();
      break;
    case "toggle-sidebar":
      state.sidebarVisible = !state.sidebarVisible;
      render();
      break;
    case "toggle-aside":
      state.asideVisible = !state.asideVisible;
      render();
      break;
    case "theme-dark":
      state.theme = "dark";
      render();
      break;
    case "theme-light":
      state.theme = "light";
      render();
      break;
    case "chat-model":
      state.chatPop = state.chatPop === "model" ? null : "model";
      renderAside();
      break;
    case "chat-effort":
      state.chatPop = state.chatPop === "effort" ? null : "effort";
      renderAside();
      break;
    case "pick-model":
      state.chatModel = el.dataset.model;
      state.chatPop = null;
      renderAside();
      break;
    case "pick-effort":
      state.chatEffort = el.dataset.effort;
      state.chatPop = null;
      renderAside();
      break;
    case "send":
      sendChat();
      break;
    case "attach":
      break;
    case "new-tab":
      newTab();
      break;
    case "focus-agent":
    case "fleet-agent":
    case "tail":
    case "compare":
    case "split":
    case "refresh":
    case "noop":
    case "new-workspace":
    case "multihost":
    case "clear-events":
    case "save-layout":
    case "restore-layout":
    case "close-app":
      break;
  }
  // Any click outside a picker dismisses its popover.
  if (state.chatPop && !e.target.closest(".picker")) {
    state.chatPop = null;
    renderAside();
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "palInput") {
    state.paletteQuery = e.target.value;
    // Only the list is rebuilt: replacing the input would break IME composition.
    const list = $("palList");
    if (list) list.innerHTML = paletteListHtml();
    return;
  }
  if (e.target.id === "chatInput") {
    state.draft = e.target.value;
    const send = document.querySelector(".send-round");
    if (send) send.classList.toggle("ready", state.draft.trim().length > 0);
  }
});

document.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (e.target.id === "chatInput" && e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendChat();
    return;
  }
  if (mod && e.key.toLowerCase() === "k") {
    e.preventDefault();
    state.overlay = "palette";
    state.paletteQuery = "";
    render();
    setTimeout(() => { const i = $("palInput"); if (i) i.focus(); }, 0);
  } else if (mod && e.key === ",") {
    e.preventDefault();
    state.overlay = "settings";
    render();
  } else if (mod && e.key.toLowerCase() === "b") {
    e.preventDefault();
    state.sidebarVisible = !state.sidebarVisible;
    render();
  } else if (mod && e.key.toLowerCase() === "j") {
    e.preventDefault();
    state.asideVisible = !state.asideVisible;
    render();
  } else if (e.key === "Escape" && state.overlay) {
    state.overlay = null;
    render();
  } else if (mod && e.key.toLowerCase() === "t") {
    e.preventDefault();
    newTab();
  }
});

/* pane width drag */
let drag = null;
document.addEventListener("mousedown", (e) => {
  const grip = e.target.closest("[data-grip]");
  if (!grip) return;
  e.preventDefault();
  drag = { side: grip.dataset.grip, startX: e.clientX, startW: grip.parentElement.getBoundingClientRect().width };
  grip.classList.add("drag");
  document.body.style.cursor = "col-resize";
  document.body.style.userSelect = "none";
});
document.addEventListener("mousemove", (e) => {
  if (!drag) return;
  const delta = drag.side === "sidebar" ? e.clientX - drag.startX : drag.startX - e.clientX;
  const next = Math.max(drag.side === "sidebar" ? 200 : 280, Math.min(drag.side === "sidebar" ? 420 : 560, drag.startW + delta));
  const target = drag.side === "sidebar" ? $("sidebar") : $("aside");
  target.style.width = next + "px";
});
document.addEventListener("mouseup", () => {
  if (!drag) return;
  document.querySelectorAll(".grip").forEach((g) => g.classList.remove("drag"));
  document.body.style.cursor = "";
  document.body.style.userSelect = "";
  drag = null;
});

/* live event ticker: only while the events view is in front */
setInterval(() => {
  if (state.rail !== "events" || state.overlay) return;
  const pool = [
    { kind: "pane.agent_status_changed", src: "agent", target: "zenix/t1/p3", detail: "running → done", tone: "ok" },
    { kind: "plugin.log", src: "plugin", target: "swarm", detail: "board refreshed · 12 cards", tone: "violet" },
    { kind: "tab.focused", src: "tab", target: "zenix", detail: '"tests"', tone: "dim" }
  ];
  const pick = pool[Math.floor(Math.random() * pool.length)];
  const now = new Date();
  const t = [now.getHours(), now.getMinutes(), now.getSeconds()].map((n) => String(n).padStart(2, "0")).join(":");
  model.events.unshift({ t: t, ...pick });
  model.events = model.events.slice(0, 40);
  if (state.rail === "events") renderSidebar();
}, 5200);

render();
</script>
</body>
