[package]
name = "zenix"
version = "0.1.0"
edition = "2024"
authors = ["zenix contributors"]
description = "A cross-platform GPUI frontend for herdr terminal workspace manager — extensible with plugins and sub-apps"
license = "GPL-3.0-or-later"

[dependencies]
# Vendored daemon-facing crates (not published; see vendor/*/NOTICE.md).
herdr-client = { path = "vendor/herdr-client" }
herdr-protocol = { path = "vendor/herdr-protocol" }
# GPUI itself (the `gpui-pre` snapshot the component library pins) and its
# platform backends. The library draws on the same snapshot, so an entity
# crosses the seam without a translation type.
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = [
    "font-kit",
    "wayland",
    "x11",
] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
sysinfo = "0.32"
rust-i18n = "4"
rust-i18n-macro = "4"
toml = "0.8"
# Mirrors the daemon's plugin path component hashing (src/plugins/paths.rs);
# already in the graph through vendored crates.
sha2 = "0.10"
image = "0.25"
unicode-width = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "process"] }
futures = "0.3"
rmcp = { version = "2.2", default-features = true, features = ["transport-io"] }
# The component library (MIT), pinned by commit: its crates share one GPUI
# snapshot (`gpui-pre 0.3.10`, the same one declared above) with this app, so
# an entity crosses the seam without a translation type. The three crates
# named here are the ones the window reads directly; the rest arrive through
# them as their own dependencies require.
ely-core = { git = "file:///home/zero/zero/up/Ely-GPUI-Components", rev = "30c66fe1d5d23db769a6c834b771d054d7f288cf", features = [
    "fonts",
    "platform",
] }
ely-chat = { git = "file:///home/zero/zero/up/Ely-GPUI-Components", rev = "30c66fe1d5d23db769a6c834b771d054d7f288cf" }
ely-agent = { git = "file:///home/zero/zero/up/Ely-GPUI-Components", rev = "30c66fe1d5d23db769a6c834b771d054d7f288cf" }
# The settings surface's own pieces (U3-1): the section/row vocabulary the
# design's pages are made of, and the appearance controls (mode, accent).
ely-settings = { git = "file:///home/zero/zero/up/Ely-GPUI-Components", rev = "30c66fe1d5d23db769a6c834b771d054d7f288cf" }
jiff = "0.2"

[dev-dependencies]
# Tests need GPUI's test support (headless windows, painted-frame inspection).
# Resolver 2 keeps this off the production dependency graph. The component
# library's own test entry rides on the same feature.
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }
ely-core = { git = "file:///home/zero/zero/up/Ely-GPUI-Components", rev = "30c66fe1d5d23db769a6c834b771d054d7f288cf", features = [
    "test-support",
] }

[target.'cfg(windows)'.dependencies]
interprocess = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "re2zero <yangwu@uniontech.com>"
section = "utils"
priority = "optional"
# `$auto` is cargo-deb's ldd-derived list; the two named libraries are loaded
# with dlopen (EGL and the Wayland client), so ldd cannot see them.
depends = "$auto, libegl1, libwayland-client0"
assets = [
    ["target/release/zenix", "usr/bin/", "755"],
    ["res/herdr", "usr/share/zenix/", "755"],
    ["res/zenix.desktop", "usr/share/applications/", "644"],
    ["res/zenix.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    # License texts. zenix embeds no font of its own: the component library's
    # faces (Inter, JetBrains Mono, IBM Plex Sans) are compiled into the binary
    # by its assets, so their OFL texts travel beside its MIT notice.
    ["LICENSE", "usr/share/doc/zenix/copyright", "644"],
    ["THIRD-PARTY.md", "usr/share/doc/zenix/", "644"],
    # The component library is statically linked and MIT: its notice travels
    # with the binary the same way the fonts' OFL texts do.
    ["licenses/ely/LICENSE", "usr/share/doc/zenix/ely/LICENSE", "644"],
    [
        "licenses/ely/Inter-OFL.txt",
        "usr/share/doc/zenix/ely/Inter-OFL.txt",
        "644",
    ],
    [
        "licenses/ely/JetBrainsMono-OFL.txt",
        "usr/share/doc/zenix/ely/JetBrainsMono-OFL.txt",
        "644",
    ],
    [
        "licenses/ely/IBMPlexSans-OFL.txt",
        "usr/share/doc/zenix/ely/IBMPlexSans-OFL.txt",
        "644",
    ],
    ["licenses/herdr/LICENSE", "usr/share/doc/zenix/herdr/LICENSE", "644"],
    [
        "vendor/herdr-client/LICENSE-APACHE",
        "usr/share/doc/zenix/herdr-client/LICENSE-APACHE",
        "644",
    ],
    [
        "vendor/herdr-client/NOTICE.md",
        "usr/share/doc/zenix/herdr-client/NOTICE.md",
        "644",
    ],
    [
        "vendor/herdr-protocol/LICENSE-APACHE",
        "usr/share/doc/zenix/herdr-protocol/LICENSE-APACHE",
        "644",
    ],
    [
        "vendor/herdr-protocol/NOTICE.md",
        "usr/share/doc/zenix/herdr-protocol/NOTICE.md",
        "644",
    ],
]
extended-description = """\
zenix is an extensible terminal workspace manager designed for AI coding agents.
It provides workspace, tab, and pane management with a client-server
architecture, plus system monitoring and plugin support.
.
This package contains the GPUI frontend that embeds the herdr
terminal client and auto-connects on first launch."""
