    class:
      en: "Class"
      zh-CN: "类别"
    hooked:
      en: "Hook"
      zh-CN: "钩子"
    hooked_yes:
      en: "an installed plugin hooks it"
      zh-CN: "有已安装插件挂钩"
    hooked_no:
      en: "no plugin hooks it"
      zh-CN: "没有插件挂钩"
    subscribed:
      en: "one of %{count} subscribed kinds"
      zh-CN: "属于 %{count} 个订阅事件之一"
    unlisted:
      en: "not one of the 21 subscribed kinds; the stream kept the daemon's own name"
      zh-CN: "不在 21 个订阅事件之内；流保留 daemon 自己的名字"
    metadata:
      en: "Metadata"
      zh-CN: "元数据"
    source:
      en: "Source"
      zh-CN: "来源"
    source_live:
      en: "endpoint subscription · live"
      zh-CN: "endpoint 订阅 · 在线"
    source_down:
      en: "endpoint subscription · down"
      zh-CN: "endpoint 订阅 · 断开"
    arrived:
      en: "Arrived"
      zh-CN: "到达"
    size:
      en: "Bytes"
      zh-CN: "字节"
    lane:
      en: "State changes arrive only as pushes; the JSON lane is for on-demand plugin.* / worktree.* / layout.* reads."
      zh-CN: "状态变化只来自推送；JSON lane 用于 plugin.* / worktree.* / layout.* 的按需读取。"
    copy:
      en: "Copy JSON"
      zh-CN: "复制 JSON"
    open_contract:
      en: "Open the event contract"
      zh-CN: "打开事件契约"
