_version: 2

# Every key here is a string the client actually draws. A key for a surface
# that no longer exists is not kept: the settings pages for MCP, Skills, API
# providers, agent install and the system panel were removed in M1, and the
# landing screen went with them.
#
# Placeholders are `%{name}` — rust-i18n 4.2.4 substitutes only that form and
# passes a bare `{name}` through verbatim (measured, see src/i18n.rs's test).

# The terminal view's own chrome: the card drawn over a dropped connection and
# the window title fallback.
terminal:
  reconnect:
    title:
      en: "Connection lost"
      zh-CN: "连接已断开"
    body:
      en: "Showing the last picture while zenix reconnects. Keys and clicks are not sent until the daemon answers again."
      zh-CN: "zenix 正在重连，当前画面是最后一次收到的内容。daemon 恢复前，按键与点击不会送达。"
    retry:
      en: "Reconnect now"
      zh-CN: "立即重连"
    update_daemon:
      en: "The herdr daemon is out of date. Run `herdr update`, then reconnect."
      zh-CN: "herdr daemon 版本过旧，请先执行 `herdr update`，再重连。"
    update_client:
      en: "zenix is out of date. Update the zenix package, then reopen the window."
      zh-CN: "zenix 版本过旧，请更新 zenix 包后重新打开窗口。"
  title:
    fallback:
      en: "zenix"
      zh-CN: "zenix"
  # The find field over a pane's scrollback: its placeholder, the count beside
  # the query, and the line shown when the daemon would not take the search.
  find:
    placeholder:
      en: "Find in scrollback"
      zh-CN: "在回滚中查找"
    none:
      en: "No results"
      zh-CN: "无结果"
    count:
      en: "%{index} of %{total}"
      zh-CN: "%{index} / %{total}"
    found:
      en: "%{total} found"
      zh-CN: "找到 %{total} 处"
    not_sent:
      en: "the daemon did not take the search"
      zh-CN: "daemon 未接受搜索请求"
  # The marker in the corner while keyboard copy mode holds the keys.
  copy_mode:
    badge:
      en: "COPY"
      zh-CN: "复制模式"

status:
  connected:
    en: "Connected"
    zh-CN: "已连接"
  disconnected:
    en: "Disconnected: %{reason}"
    zh-CN: "已断开: %{reason}"
  # The connection segment's other two states: the handshake is not finished,
  # and the handshake is finished but the first snapshot has not landed.
  connecting:
    en: "connecting to the herdr daemon..."
    zh-CN: "正在连接 herdr daemon…"
  awaiting_snapshot:
    en: "connected; waiting for snapshot"
    zh-CN: "已连接；等待快照"
  # `disconnected` needs a reason. The daemon always carries one when it drops
  # the connection, so this is the word for the case where there is none.
  no_reason:
    en: "disconnected"
    zh-CN: "已断开"
  # The bar's other offline facts (U3-5): what the session holds when it holds
  # nothing, and the daemon's own state as its own segment.
  no_workspace:
    en: "no workspace"
    zh-CN: "没有工作区"
  daemon_stopped:
    en: "daemon not running"
    zh-CN: "daemon 未启动"
  # What the session holds. The counts are the daemon's own lists, so the bar
  # cannot disagree with the sidebar about how many workspaces there are.
  # rust-i18n has no plural forms: the singular is a key of its own, chosen in
  # `panels::counted`, and `ws` is short enough not to inflect.
  counts:
    en: "%{workspaces} · %{tabs} · %{panes}"
    zh-CN: "%{workspaces} · %{tabs} · %{panes}"
  count:
    ws:
      en: "%{count} ws"
      zh-CN: "%{count} 工作区"
    tab_one:
      en: "%{count} tab"
      zh-CN: "%{count} 标签"
    tab_many:
      en: "%{count} tabs"
      zh-CN: "%{count} 标签"
    pane_one:
      en: "%{count} pane"
      zh-CN: "%{count} 面板"
    pane_many:
      en: "%{count} panes"
      zh-CN: "%{count} 面板"
  # The fleet stream's counts, the same statuses the cockpit draws.
  agents:
    en: "%{running} running · %{blocked} blocked"
    zh-CN: "%{running} 运行中 · %{blocked} 等待输入"
  # The prefix key, always named at the bar's right edge; it lights while the
  # prefix is armed and the next key is its chord.
  prefix:
    en: "prefix"
    zh-CN: "前缀"
  # The stream the picture came from, as the bar's dim trailing fact.
  source:
    snapshot:
      en: "snapshot"
      zh-CN: "snapshot"
    # The picture before the first snapshot: the segment names what it waits on
    # rather than claiming `snapshot`.
    waiting:
      en: "waiting for snapshot"
      zh-CN: "等待快照"

