# The shell's own copy: what it draws outside the settings pages. Two things are
# deliberately not here. Symbol-only buttons (`<`, `+`, `x`, `^`) are glyphs, not
# words, so a locale has nothing to say about them; and the language names on the
# Appearance page stay as each language calls itself.
shell:
  titlebar:
    search:
      en: "Search workspaces, commands, plugin actions…"
      zh-CN: "搜索工作区、命令、插件 action…"
  # The sidebar views' own names, for the head strip above their blocks.
