# The shell's own copy: what it draws outside the settings pages. Two things are
# deliberately not here. Symbol-only buttons (`<`, `+`, `x`, `^`) are glyphs, not
# words, so a locale has nothing to say about them; and the language names on the
# Appearance page stay as each language calls itself.
shell:
  titlebar:
    search:
      en: "Search workspaces, commands, plugin actions…"
      zh-CN: "搜索工作区、命令、插件 action…"
  workspaces:
    en: "Workspaces"
    zh-CN: "工作区"
  palette:
    prompt:
      en: "type a command"
      zh-CN: "输入命令"
    no_matches:
      en: "nothing matches"
      zh-CN: "没有匹配项"
    group_commands:
      en: "Commands"
      zh-CN: "命令"
    group_workspaces:
      en: "Workspaces"
      zh-CN: "工作区"
    group_actions:
      en: "Plugin actions"
      zh-CN: "插件 action"
    hints:
      en: "↑↓ move · enter run · esc close"
      zh-CN: "↑↓ 选择 · Enter 运行 · Esc 关闭"
  plugins:
    title:
      en: "Plugins"
      zh-CN: "插件"
    logs:
      en: "Plugin logs"
      zh-CN: "插件日志"
    events:
      en: "Events"
      zh-CN: "事件"
    # Shown against a plugin that hooks an event the daemon has announced since
    # this client started, but has no run for in its log ring yet.
    events-not-run:
      en: "no run yet"
      zh-CN: "尚未执行"
    commands:
      en: "commands"
      zh-CN: "命令"
  # The plugin manager: one plugin's page, and the inventory the plugin view
  # counts. Every string here is read by `src/plugins/manager.rs` and the plugin
  # sidebar block beside it.
  manager:
    title:
      en: "Plugins"
      zh-CN: "插件"
    review:
      en: "Review & link…"
      zh-CN: "审查并链接…"
    open:
      en: "Open the plugin manager"
      zh-CN: "打开插件管理器"
    overview:
      en: "Contributions"
      zh-CN: "贡献点总览"
    # `%{count}` is the number of slots one plugin declared for this client.
    ui_slots:
      en: "UI %{count}"
      zh-CN: "UI %{count}"
    enabled:
      en: "enabled"
      zh-CN: "启用"
    disabled:
      en: "disabled"
      zh-CN: "停用"
    enable:
      en: "Enable"
      zh-CN: "启用"
    disable:
      en: "Disable"
      zh-CN: "停用"
    unlink:
      en: "Unlink"
      zh-CN: "解除链接"
    # `%{count}` is how many slots the plugin's `zenix-ui.toml` fills.
    declares:
      en: "zenix-ui.toml · %{count} slots"
      zh-CN: "zenix-ui.toml · %{count} 项"
    no_ui:
      en: "no zenix-ui.toml: it contributes functions only (actions, panes, hooks)"
      zh-CN: "没有 zenix-ui.toml：只贡献功能（actions / panes / hooks）"
    argv:
      en: "Commands…"
      zh-CN: "查看命令…"
    slots:
      en: "UI contributions"
      zh-CN: "UI 贡献点"
    actions:
      en: "Actions"
      zh-CN: "actions"
    no_actions:
      en: "No actions"
      zh-CN: "没有 action"
    actions_disabled:
      en: "The plugin is disabled: enable it to run these."
      zh-CN: "插件已停用：启用后才能运行。"
    panes:
      en: "Panes"
      zh-CN: "pane"
  views:
    reading:
      en: "reading"
      zh-CN: "读取中"
    no_data:
      en: "no data"
      zh-CN: "无数据"
    # A rail view with nothing to show still names itself: an empty column
    # would read as a broken view rather than an empty one.
    empty:
      agents:
        en: "No agents running"
        zh-CN: "没有运行中的智能体"
      plugins:
        en: "No plugins linked"
        zh-CN: "尚未链接插件"
      events:
        en: "Nothing has happened yet"
        zh-CN: "尚无事件"
  # The right-hand panel's tabs: the strip's labels, and what its tabs say when
  # they have nothing to show.
  aside:
    chat:
      en: "Chat"
      zh-CN: "对话"
    fleet:
      en: "Fleet"
      zh-CN: "驾驶舱"
    panels:
      en: "Panels"
      zh-CN: "插件面板"
  # The grid with no pane to paint (PLAN.md §M11c). Every entry is a command from
  # the directory, so nothing here is decoration standing in for an action.
  empty:
    title:
      en: "What would you like to do?"
      zh-CN: "想做点什么？"
    hint:
      en: "Describe a task, or pick one below. Cmd Shift P opens the command palette."
      zh-CN: "直接描述任务，或者从下面挑一个。Cmd Shift P 打开命令面板。"
    palette:
      en: "Describe a task, paste an error, or search a command…"
      zh-CN: "描述任务、粘贴错误、或搜索命令…"
    workspace:
      title:
        en: "Open a workspace"
        zh-CN: "打开工作区"
      detail:
        en: "Bring a repository in and start a shell"
        zh-CN: "把一个仓库接进来，起一个 shell"
    split:
      title:
        en: "Split to run tests"
        zh-CN: "分屏跑测试"
      detail:
        en: "Open a column in this tab, keeping the current pane"
        zh-CN: "在这个标签里开一列，保留当前窗格"
    layout:
      title:
        en: "Restore a layout template"
        zh-CN: "从布局模板恢复"
      detail:
        en: ".zenix/layout.toml travels with the repository"
        zh-CN: ".zenix/layout.toml 跟着仓库走"
    trust:
      title:
        en: "Review and link a plugin"
        zh-CN: "审查并链接插件"
      detail:
        en: "See what it would run before it runs"
        zh-CN: "先看清它会执行什么"
    panels:
      en: "No plugin has declared a panel for this client."
      zh-CN: "没有插件为本客户端声明面板。"
    panels_action:
      en: "Review and link a plugin"
      zh-CN: "审查并链接插件"
  trust:
    title:
      en: "Link a plugin — what it would run"
      zh-CN: "链接插件 — 它会运行什么"
    review:
      en: "Review"
      zh-CN: "查看"
    link:
      en: "Link"
      zh-CN: "链接"
    type_directory:
      en: "Type the directory a plugin lives in."
      zh-CN: "请输入插件所在的目录。"
    invitation:
      en: "Type a plugin directory and press Enter to read the commands it would run."
      zh-CN: "输入插件目录并按回车，读取它将运行的命令。"
    would_run:
      en: "%{count} command(s) would run as you, with the plugin's directory as the working directory."
      zh-CN: "将要以你的身份运行 %{count} 条命令，工作目录为插件所在的目录。"
    no_commands:
      en: "This manifest declares no command."
      zh-CN: "该清单没有声明任何命令。"
    # The sentence the whole review exists for: linking is what makes the
    # commands below run as the user, with the daemon's own rights.
    contract:
      en: "herdr runs a plugin as a process, not in a sandbox: once linked, its commands have the daemon's rights."
      zh-CN: "herdr 插件不是沙箱进程：链接后，它的命令与 daemon 同权限。"
    declared:
      en: "What this client would draw"
      zh-CN: "读取到的 UI 声明"
    no_ui:
      en: "No zenix-ui.toml: the plugin contributes functions only."
      zh-CN: "没有 zenix-ui.toml：只贡献功能。"
    linking:
      en: "linking %{path}…"
      zh-CN: "正在链接 %{path}…"

# The project's layout template. The block names the project it found by walking up
# from the focused pane, and the two lines below are what a save or a restore did.
layout:
  title:
    en: "Layout"
    zh-CN: "布局"
  save:
    en: "save"
    zh-CN: "保存"
  restore:
    en: "restore"
    zh-CN: "恢复"
  no_template:
    en: "no template in this project"
    zh-CN: "此项目没有模板"
  panes:
    en: "%{panes} panes"
    zh-CN: "%{panes} 个窗格"
  saved:
    en: "saved %{path}"
    zh-CN: "已保存 %{path}"
  restored:
    en: "restored as tab %{tab}"
    zh-CN: "已恢复为标签 %{tab}"

# The orchestration cockpit: the running agents as a fleet. `summary` counts what
# the daemon reports now; the rows add what only this client watched — how long a
# status has held, and what it came from.
fleet:
  title:
    en: "Cockpit"
    zh-CN: "编排驾驶舱"
  summary:
    en: "%{agents} agents · %{blocked} blocked"
    zh-CN: "%{agents} 个 Agent · %{blocked} 个阻塞"
  compare:
    en: "compare"
    zh-CN: "对比"
  clear:
    en: "clear"
    zh-CN: "清空"
  empty:
    en: "No agents in flight."
    zh-CN: "当前没有在运行的 Agent。"
  tail_empty:
    en: "(no output yet)"
    zh-CN: "（暂无输出）"

