    family_gruvbox:
      en: "Gruvbox"
      zh-CN: "Gruvbox"
    family_solarized:
      en: "Solarized"
      zh-CN: "Solarized"
    family_tokyonight:
      en: "Tokyo Night"
      zh-CN: "Tokyo Night"
    family_matrix:
      en: "Matrix"
      zh-CN: "Matrix"
    theme:
      en: "Mode"
      zh-CN: "明暗"
    theme_description:
      en: "The chrome, the terminal and every plugin panel switch together."
      zh-CN: "壳、终端与所有插件面板同时切换。"
    theme_light:
      en: "Light"
      zh-CN: "浅色"
    theme_dark:
      en: "Dark"
      zh-CN: "深色"
    locale:
      en: "Language"
      zh-CN: "语言"
    locale_description:
      en: "The language of the interface; the terminal is untouched."
      zh-CN: "界面文案的语言，终端不受影响。"
    density:
      en: "Density"
      zh-CN: "界面密度"
    density_description:
      en: "Compact draws the sidebar's list rows shorter, so a screen fits more of them."
      zh-CN: "紧凑把侧栏列表行画矮一些，一屏多容纳两行。"
    density_comfortable:
      en: "Comfortable"
      zh-CN: "舒适"
    density_compact:
      en: "Compact"
      zh-CN: "紧凑"
  terminal:
    title:
      en: "Terminal"
      zh-CN: "终端"
    description:
      en: "Palettes, the metrics cells are drawn at, and the cursor shape — the client paints all three. Scrollback is the daemon's."
      zh-CN: "调色板、单元格的绘制尺寸与光标形状——三者都由客户端绘制。回滚由 daemon 持有。"
    palette_dark:
      en: "Palette (dark)"
      zh-CN: "调色板（深色）"
    palette_dark_description:
      en: "Named cell colors resolve against this palette in dark mode."
      zh-CN: "深色模式下的命名单元格色。"
    palette_light:
      en: "Palette (light)"
      zh-CN: "调色板（浅色）"
    palette_light_description:
