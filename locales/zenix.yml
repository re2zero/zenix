_version: 2

# Every key here is a string the client actually draws. A key for a surface
# that no longer exists is not kept: the settings pages for MCP, Skills, API
# providers, agent install and the system panel were removed in M1, and the
# landing screen went with them.
#
# Placeholders are `%{name}` — rust-i18n 4.2.4 substitutes only that form and
# passes a bare `{name}` through verbatim (measured, see src/i18n.rs's test).

# The terminal view's own chrome: the card drawn over a dropped connection and
# the window title fallback.
terminal:
  reconnect:
    title:
      en: "Connection lost"
      zh-CN: "连接已断开"
    body:
      en: "Showing the last picture while zenix reconnects. Keys and clicks are not sent until the daemon answers again."
      zh-CN: "zenix 正在重连，当前画面是最后一次收到的内容。daemon 恢复前，按键与点击不会送达。"
    retry:
      en: "Reconnect now"
      zh-CN: "立即重连"
    update_daemon:
      en: "The herdr daemon is out of date. Run `herdr update`, then reconnect."
      zh-CN: "herdr daemon 版本过旧，请先执行 `herdr update`，再重连。"
    update_client:
      en: "zenix is out of date. Update the zenix package, then reopen the window."
      zh-CN: "zenix 版本过旧，请更新 zenix 包后重新打开窗口。"
  title:
    fallback:
      en: "zenix"
      zh-CN: "zenix"
  # The find field over a pane's scrollback: its placeholder, the count beside
  # the query, and the line shown when the daemon would not take the search.
  find:
    placeholder:
      en: "Find in scrollback"
      zh-CN: "在回滚中查找"
    none:
      en: "No results"
      zh-CN: "无结果"
    count:
      en: "%{index} of %{total}"
      zh-CN: "%{index} / %{total}"
    found:
      en: "%{total} found"
      zh-CN: "找到 %{total} 处"
    not_sent:
      en: "the daemon did not take the search"
      zh-CN: "daemon 未接受搜索请求"
  # The marker in the corner while keyboard copy mode holds the keys.
  copy_mode:
    badge:
      en: "COPY"
      zh-CN: "复制模式"

status:
  connected:
    en: "Connected"
    zh-CN: "已连接"
  disconnected:
    en: "Disconnected: %{reason}"
    zh-CN: "已断开: %{reason}"
  # The connection segment's other two states: the handshake is not finished,
  # and the handshake is finished but the first snapshot has not landed.
  connecting:
    en: "connecting to the herdr daemon..."
    zh-CN: "正在连接 herdr daemon…"
  awaiting_snapshot:
    en: "connected; waiting for snapshot"
    zh-CN: "已连接；等待快照"
  # `disconnected` needs a reason. The daemon always carries one when it drops
  # the connection, so this is the word for the case where there is none.
  no_reason:
    en: "disconnected"
    zh-CN: "已断开"
  # What the session holds. The counts are the daemon's own lists, so the bar
  # cannot disagree with the sidebar about how many workspaces there are.
  # rust-i18n has no plural forms: the singular is a key of its own, chosen in
  # `panels::counted`, and `ws` is short enough not to inflect.
  counts:
    en: "%{workspaces} · %{tabs} · %{panes}"
    zh-CN: "%{workspaces} · %{tabs} · %{panes}"
  count:
    ws:
      en: "%{count} ws"
      zh-CN: "%{count} 工作区"
    tab_one:
      en: "%{count} tab"
      zh-CN: "%{count} 标签"
    tab_many:
      en: "%{count} tabs"
      zh-CN: "%{count} 标签"
    pane_one:
      en: "%{count} pane"
      zh-CN: "%{count} 面板"
    pane_many:
      en: "%{count} panes"
      zh-CN: "%{count} 面板"
  # The fleet stream's counts, the same statuses the cockpit draws.
  agents:
    en: "%{running} running · %{blocked} blocked"
    zh-CN: "%{running} 运行中 · %{blocked} 等待输入"
  # The prefix key, always named at the bar's right edge; it lights while the
  # prefix is armed and the next key is its chord.
  prefix:
    en: "prefix"
    zh-CN: "前缀"

settings:
  title:
    en: "Settings"
    zh-CN: "设置"
  close:
    en: "Close"
    zh-CN: "关闭"
  effective:
    en: "Every change takes effect at once, and each load walks the file against the schema."
    zh-CN: "写入即生效 · 每次加载都按 schema 校验"
  layout:
    title:
      en: "Layout"
      zh-CN: "布局"
    description:
      en: "zenix's own chrome. The panes belong to the daemon."
      zh-CN: "zenix 自己的界面外壳。窗格归 daemon 所有。"
    sidebar_visible:
      en: "Sidebar"
      zh-CN: "侧栏"
    sidebar_description:
      en: "The workspace tree down the left, and the rail beside it."
      zh-CN: "左侧的工作区树与活动栏。"
    sidebar_width:
      en: "Sidebar width"
      zh-CN: "侧栏宽度"
    aside_visible:
      en: "Chat panel"
      zh-CN: "对话面板"
    aside_description:
      en: "Closed by default: the window is opened for the terminal."
      zh-CN: "默认关闭：窗口是为终端开的。"
    aside_width:
      en: "Chat panel width"
      zh-CN: "对话面板宽度"
  keys:
    title:
      en: "Keys"
      zh-CN: "键位"
    description:
      en: "The prefix and the chords that reach the shell, read from the command directory. Chords a plugin declares live in the plugin view."
      zh-CN: "前缀键与到达壳的键位，读自命令目录。插件声明的键位在插件视图里。"
    prefix:
      en: "Prefix key"
      zh-CN: "前缀键"
  plugins:
    title:
      en: "Plugins"
      zh-CN: "插件"
    description:
      en: "Plugins are the daemon's. zenix reads their manifests, renders what they declare, and reviews a directory before it is linked."
      zh-CN: "插件归 daemon 所有。zenix 读它们的清单、渲染它们声明的内容，并在链接前审查目录。"
    host:
      en: "Host"
      zh-CN: "插件宿主"
    host_value:
      en: "the herdr daemon · plugin.list"
      zh-CN: "herdr daemon · plugin.list"
    daemon_config:
      en: "Daemon config"
      zh-CN: "daemon 配置"
    declarations:
      en: "UI declarations"
      zh-CN: "UI 声明"
    declarations_value:
      en: "<plugin root>/zenix-ui.toml — rows, panels and status segments, drawn by this client"
      zh-CN: "<插件根>/zenix-ui.toml —— 行、面板与状态段，由本客户端绘制"
    review:
      en: "Review before linking"
      zh-CN: "链接前审查"
    review_value:
      en: "always: every argv the directory would run is shown first"
      zh-CN: "强制：先展示目录将要执行的每一条 argv"
    sandbox:
      en: "No sandbox"
      zh-CN: "无沙箱"
    sandbox_value:
      en: "a plugin runs with the daemon's permissions; the review is the only gate"
      zh-CN: "插件与 daemon 同权限运行；审查面是唯一的闸门"
  mcp:
    title:
      en: "MCP"
      zh-CN: "MCP"
    description:
      en: "What this window offers an agent while it is open, and what a shell-less agent reaches back through."
      zh-CN: "窗口开启期间向 agent 提供的工具，以及没有 shell 的 agent 反向进入的桥。"
    orchestrator:
      en: "Orchestrator socket"
      zh-CN: "编排器 socket"
    tools:
      en: "Tools"
      zh-CN: "工具面"
    tools_value:
      en: "the orchestrator's own tools, plus one per runnable plugin action"
      zh-CN: "编排器自有工具 + 每个可运行的插件 action 一个"
    bridge:
      en: "Reverse bridge"
      zh-CN: "反向桥"
    bridge_value:
      en: "zenix mcp-agent · one tool: agent_send · windowless stdio"
      zh-CN: "zenix mcp-agent · 单工具 agent_send · 无窗口 stdio"
  config:
    title:
      en: "Config file"
      zh-CN: "配置文件"
    description:
      en: "What zenix remembers, and what it found wrong with the file."
      zh-CN: "zenix 记住的内容，以及它在文件里发现的问题。"
    path:
      en: "File"
      zh-CN: "文件"
    open:
      en: "Open"
      zh-CN: "打开"
    reset:
      en: "Restore defaults"
      zh-CN: "恢复默认"
    reset_description:
      en: "Writes the appearance, terminal and layout sections back to their defaults. The window's size is the closing window's own."
      zh-CN: "把外观、终端与布局三段写回默认值。窗口尺寸由关闭时的窗口自行记住，不在此列。"
    reset_confirm:
      en: "Press again to confirm"
      zh-CN: "再按一次确认"
    problems:
      en: "Problems"
      zh-CN: "问题"
    problems_short:
      en: "config: %{count} problems"
      zh-CN: "配置: %{count} 个问题"
    no_problems:
      en: "No problems found"
      zh-CN: "未发现问题"
    daemon:
      en: "Daemon settings"
      zh-CN: "daemon 设置"
    daemon_hint:
      en: "Pane shell, new-workspace cwd, scrollback, keybindings and plugins live in the daemon's own config."
      zh-CN: "窗格 shell、新工作区目录、回滚、键位与插件在 daemon 自己的配置里。"
  appearance:
    title:
      en: "Appearance"
      zh-CN: "外观"
    description:
      en: "How zenix itself is drawn. All take effect at once and are remembered."
      zh-CN: "zenix 自身的显示方式。各项都即时生效并被记住。"
    family:
