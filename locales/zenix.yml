      zh-CN: "侧栏"
    sidebar_width:
      en: "Sidebar width"
      zh-CN: "侧栏宽度"
    aside_visible:
      en: "Chat panel"
      zh-CN: "对话面板"
    aside_width:
      en: "Chat panel width"
      zh-CN: "对话面板宽度"
  config:
    title:
      en: "Config file"
      zh-CN: "配置文件"
    description:
      en: "What zenix remembers, and what it found wrong with the file."
      zh-CN: "zenix 记住的内容，以及它在文件里发现的问题。"
    path:
      en: "File"
      zh-CN: "文件"
    problems:
      en: "Problems"
      zh-CN: "问题"
    problems_short:
      en: "config: %{count} problems"
      zh-CN: "配置: %{count} 个问题"
    no_problems:
      en: "No problems found"
      zh-CN: "未发现问题"
    daemon:
