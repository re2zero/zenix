      zh-CN: "插件"
    events:
      en: "Events"
      zh-CN: "事件"
    layout:
      en: "Layout"
      zh-CN: "布局"
  # What each view holds right now, as the head's dim count.
  head:
    workspaces:
      en: "%{workspaces} · %{panes} panes"
      zh-CN: "%{workspaces} 个 · %{panes} 个窗格"
    agents:
      en: "%{agents} · %{active} active"
