      en: "Copy list"
      zh-CN: "复制清单"
  # The layout inspector (U3-4): the project's template as a file, its split
  # tree, and the daemon's export/apply. The empty and broken states each say
  # what the file is and what can be done next.
  layout_sheet:
    title:
      en: "Layout"
      zh-CN: "布局"
    synced:
      en: "in sync"
      zh-CN: "已同步"
    absent:
      en: "no file"
      zh-CN: "无文件"
    broken:
      en: "will not parse"
      zh-CN: "解析失败"
    no_project:
      en: "no focused pane directory"
      zh-CN: "没有聚焦窗格的目录"
    apply:
      en: "Apply"
      zh-CN: "应用"
    export:
      en: "Export"
      zh-CN: "导出"
    copy_path:
      en: "Copy path"
      zh-CN: "复制路径"
    diagram:
