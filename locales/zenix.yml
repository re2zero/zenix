      zh-CN: "将要以你的身份运行 %{count} 条命令，工作目录为插件所在的目录。"
    no_commands:
      en: "This manifest declares no command."
      zh-CN: "该清单没有声明任何命令。"
    # The sentence the whole review exists for: linking is what makes the
    # commands below run as the user, with the daemon's own rights.
    contract:
      en: "herdr runs a plugin as a process, not in a sandbox: once linked, its commands have the daemon's rights."
      zh-CN: "herdr 插件不是沙箱进程：链接后，它的命令与 daemon 同权限。"
    declared:
      en: "What this client would draw"
      zh-CN: "读取到的 UI 声明"
    no_ui:
      en: "No zenix-ui.toml: the plugin contributes functions only."
      zh-CN: "没有 zenix-ui.toml：只贡献功能。"
    linking:
      en: "linking %{path}…"
      zh-CN: "正在链接 %{path}…"
    # The footer's one fact about the paths the review shows: they are the
    # daemon's own algorithm, so they match what a plugin's command sees.
    paths:
      en: "Paths follow the daemon's own algorithm"
      zh-CN: "路径按 daemon 的算法计算"
    all_clear:
      en: "no command leaves the plugin"
      zh-CN: "没有命令离开插件目录"
    hazard_count:
      en: "%{high} high-risk · %{caution} caution"
      zh-CN: "%{high} 条高危 · %{caution} 条注意"
    # The six rules' sentences. The rules themselves keep a stable English
    # sentence (tests compare it); `trust::reason_label` maps it here.
    hazard_absolute_program:
      en: "runs a program at an absolute path outside the plugin"
      zh-CN: "运行插件目录之外的绝对路径程序"
    hazard_elevation:
      en: "asks for elevated privileges"
      zh-CN: "请求提权"
    hazard_inline_shell:
      en: "runs inline shell code that is not in the manifest"
      zh-CN: "运行清单未展示的内联 shell 代码"
    hazard_inline_interpreter:
      en: "runs inline interpreter code that is not in the manifest"
      zh-CN: "运行清单未展示的内联解释器代码"
    hazard_network:
      en: "reaches the network or installs packages"
      zh-CN: "访问网络或安装软件包"
    hazard_system_path:
      en: "touches a system path outside the plugin"
      zh-CN: "触碰插件目录之外的系统路径"
