  # tabs are views of the same line; every fact under them is something this
  # client actually knows (arrival time, class, byte count) and nothing it does
  # not (the daemon sends no sequence number or latency with a line).
  inspector:
    tab:
      json:
        en: "JSON"
        zh-CN: "JSON"
      raw:
        en: "Raw"
        zh-CN: "原始"
      contract:
        en: "Contract"
